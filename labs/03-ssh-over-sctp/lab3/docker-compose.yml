services:
  host1:
    build: .
    image: lab3_ubuntu
    hostname: host1
    container_name: host1
    tty: true
    networks:
      default:
        ipv4_address: 10.10.0.2
    privileged: true
  host2:
    build: .
    image: lab3_ubuntu
    hostname: host2
    container_name: host2
    tty: true
    networks:
      default:
        ipv4_address: 10.10.0.3
    privileged: true

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-lab3
    ipam:
      config:
        - subnet: 10.10.0.0/24
